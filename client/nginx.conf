server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker; dùng biến để nginx vẫn khởi động khi gateway chưa chạy (khi đó /api trả 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File build có hash trong tên → cache lâu
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
