services:
  render:
    build:
      context: ../../src
      dockerfile: Services/Render/Render.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__RenderDb: Server=sqlserver,1433;Database=RenderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: ${REDIS_URL:-redis:6379}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-umlforge}
      Jwt__Audience: ${JWT_AUDIENCE:-umlforge-client}
      DiagramEngine__Url: ${DIAGRAM_ENGINE_URL:-http://diagram-engine:8080}
      DiagramEngine__UseFake: "false"
      PlantUml__BaseUrl: ${PLANTUML_URL:-http://plantuml:8080}
    ports:
      - "5004:8080"
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }
      diagram-engine: { condition: service_healthy }
      plantuml: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
