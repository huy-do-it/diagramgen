# Huy (H-05, H-07) — service "gateway" (YARP) · port host 5000 · không có database
services:
  gateway:
    build:
      context: ../../src
      dockerfile: Gateway/UMLForge.Gateway/Dockerfile
    container_name: umlforge-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    ports:
      - "5000:8080"
    depends_on:
      identity:
        condition: service_healthy
      workspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
