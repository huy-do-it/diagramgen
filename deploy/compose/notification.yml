services:
  notification:
    build:
      context: ../../src
      dockerfile: Services/Notification/Notification.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__NotificationDb: Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True
      ConnectionStrings__Redis: ${REDIS_URL:-redis:6379}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-umlforge}
      Jwt__Audience: ${JWT_AUDIENCE:-umlforge-client}
    ports:
      - "5005:8080"
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
