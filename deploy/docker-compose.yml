# UMLForge v2 — chạy toàn bộ: docker compose -f deploy/docker-compose.yml up --build -d
# Mỗi người chỉ sửa file compose của mình trong deploy/compose/ (cần Docker Compose >= 2.20).
# Biến môi trường: copy deploy/.env.example thành deploy/.env.
include:
  - compose/infra.yml        # Bảo: sqlserver, redis, plantuml
  - compose/engine.yml       # Bảo: diagram-engine (gRPC)
  - compose/identity.yml     # Huy
  - compose/workspace.yml    # Huy
  - compose/gateway.yml      # Huy
  - compose/diagram.yml      # Thiện
  - compose/render.yml       # Minh
  - compose/notification.yml # Minh
  - compose/client.yml       # Bảo: React + nginx
